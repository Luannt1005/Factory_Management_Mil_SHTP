services:
  orgchart:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orgchart_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
